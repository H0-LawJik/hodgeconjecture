name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Runs on pushes to main and on pull requests from forks. The maintainer's own pull requests
    # merge on a clean local `python3 tools/check.py`; main is rechecked on a clean machine after
    # the merge (decision 0007).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build with the pinned toolchain and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          test: false
          lint: false

      - name: Checker
        run: python3 tools/check.py --no-build
