name = "hodgeladder"
version = "0.2.0"
defaultTargets = ["HodgeLadder", "LefschetzPort"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The statement of record is Paul-Lez/HodgeConjecture (library `HodgeConjecture`), pinned to an
# exact commit. Mathlib, Lean and verso follow its pin. Bump all of them together; see
# docs/decisions/0003-rebase-on-upstream-statement.md.
[[require]]
name = "HodgeConjecture"
git = "https://github.com/Paul-Lez/HodgeConjecture"
rev = "2ead713179628a3c738197d5996f51c8a9c886ac"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "HodgeLadder"

# Staging library for the port of the upstream Lefschetz (1,1) stack to the current upstream pin
# (rung `lefschetz-port`). A default target, so CI builds it; files keep their upstream headers.
# See docs/port-lefschetz.md.
[[lean_lib]]
name = "LefschetzPort"
srcDir = "port"
